<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Web Kernel Emulator</title>
    <style>
        body {
            background-color: #121212;
            color: #00ff00;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        canvas {
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            background: #000;
        }
        #console {
            width: 720px;
            height: 100px;
            background: #000;
            border: 2px solid #550000;
            color: #ff5555;
            padding: 10px;
            margin-top: 15px;
            overflow-y: auto;
            font-size: 12px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h1>Web Kernel Renderer</h1>
    <canvas id="screen" width="720" height="400"></canvas>
    <div id="console">[Sistema] Aguardando carregamento do kernel...</div>

    <script src="build/vm.js"></script>
    <script src="build/vga.js"></script>
    <script src="build/main.js"></script>
</body>
</html>
