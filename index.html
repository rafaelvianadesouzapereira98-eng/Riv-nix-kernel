<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Web Kernel Emulator</title>
    <style>
        body {
            background-color: #121212;
            color: #00ff00;
            font-family: monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        canvas {
            border: 4px solid #333;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
            background: #000;
        }
        input {
            margin-top: 15px;
            color: #fff;
        }
    </style>
</head>
<body>
    <h1>Web Kernel Renderer</h1>
    <canvas id="screen" width="720" height="400"></canvas>
    <input type="file" id="kernelFile" accept=".bin">

    <script src="vm.js"></script>
    <script src="vga.js"></script>
    <script src="main.js"></script>
</body>
</html>
